<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>앱 정책 문서</title>
  <meta name="description" content="앱별 개인정보 처리방침 및 이용약관">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #f6f4f0;
      --bg-accent: #e8efe9;
      --ink: #1a1f1c;
      --muted: #5a635c;
      --line: #d4d9d4;
      --link: #1f5c45;
      --link-hover: #0f3d2c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, var(--bg-accent), transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, #efe8df, transparent 50%),
        var(--bg);
      line-height: 1.6;
    }

    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 4.5rem 1.5rem 5rem;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.25;
    }

    .lead {
      margin: 0 0 2.5rem;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .app {
      border-top: 1px solid var(--line);
      padding: 1.35rem 0 1.5rem;
    }

    .app:last-of-type {
      border-bottom: 1px solid var(--line);
    }

    .app h2 {
      margin: 0 0 0.75rem;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.25rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .links a {
      color: var(--link);
      text-decoration: none;
      font-weight: 600;
    }

    .links a:hover,
    .links a:focus-visible {
      color: var(--link-hover);
    }

    footer {
      margin-top: 3rem;
      color: var(--muted);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>앱 정책 문서</h1>
    <p class="lead">앱별 개인정보 처리방침과 이용약관을 확인할 수 있습니다.</p>

    <section class="app">
      <h2>벙벙(BungBung)</h2>
      <ul class="links">
        <li><a href="bungbung/privacy.html">개인정보 처리방침</a></li>
        <li><a href="bungbung/terms.html">이용약관</a></li>
      </ul>
    </section>
    <!-- 새 앱 추가 시 위 section을 복사해 링크를 추가하세요. -->

    <footer>
      <p>앱 스토어 등록 시 해당 문서 URL을 사용하세요.</p>
    </footer>
  </main>
</body>
</html>
